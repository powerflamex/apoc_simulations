<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Trillion Years</title>
<style>
  @font-face { font-family: 'Cormorant'; font-style: normal; font-weight: 500;
    src: url('node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-500-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Cormorant'; font-style: italic; font-weight: 500;
    src: url('node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-500-italic.woff2') format('woff2'); }
  @font-face { font-family: 'Cormorant'; font-style: normal; font-weight: 600;
    src: url('node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-600-normal.woff2') format('woff2'); }

  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000;
    transform-origin: 0 0; }
  #stage canvas { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }

  .serif { font-family: 'Cormorant', Georgia, serif; color: #f4efe6; }

  #counter { position: absolute; left: 74px; top: 820px; width: 700px;
    text-shadow: 0 2px 18px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.6); }
  #counter .row { position: absolute; left: 0; top: 0; white-space: nowrap; }
  #counter .label { font: 600 25px 'Cormorant', serif; letter-spacing: .32em; opacity: .85; }
  #counter .value { font: 500 92px/1 'Cormorant', serif; letter-spacing: .01em; margin-top: 6px;
    font-variant-numeric: lining-nums tabular-nums; }
  #counter .unit { font: 700 34px 'Cormorant', serif; letter-spacing: .12em; opacity: 1; margin-top: 12px; width: 940px; white-space: normal; line-height: 1.15; }
  #counter .badge { font: 700 24px 'Cormorant', serif; letter-spacing: .2em; margin-top: 14px; padding: 6px 14px 4px;
    background: rgba(200, 40, 40, .75); color: #fff6ee; display: none; }

  #caption { position: absolute; left: 60px; right: 60px; top: 1190px; text-align: center;
    font: italic 500 58px/1.15 'Cormorant', serif;
    text-shadow: 0 2px 22px rgba(0,0,0,.7), 0 1px 3px rgba(0,0,0,.8); }

  #stamp { position: absolute; left: 0; right: 0; top: 1360px; text-align: center; opacity: 0;
    font: italic 500 138px/1 'Cormorant', serif; color: #f1c978;
    text-shadow: 0 4px 40px rgba(0,0,0,.85), 0 2px 6px rgba(0,0,0,.9); }
  #stampw { position: absolute; left: 0; right: 0; top: 1322px; text-align: center; opacity: 0;
    font: 700 30px 'Cormorant', serif; letter-spacing: .4em; padding-left: .4em; color: #f4efe6;
    text-shadow: 0 2px 18px rgba(0,0,0,.85), 0 1px 3px rgba(0,0,0,.9); }

  #title { position: absolute; left: 60px; right: 60px; top: 450px; text-align: center; opacity: 0;
    text-shadow: 0 2px 30px rgba(0,0,0,.85), 0 1px 4px rgba(0,0,0,.9); }
  #title .t { font: 600 100px/1.05 'Cormorant', serif; }
  #title .rule { width: 120px; height: 1px; background: rgba(244,239,230,.6); margin: 40px auto 26px; }
  #title .s { font: 600 24px 'Cormorant', serif; letter-spacing: .34em; opacity: .8; }

  #cover { position: absolute; left: 40px; right: 40px; top: 330px; text-align: center; opacity: 0;
    text-shadow: 0 4px 44px rgba(0,0,0,.9), 0 2px 6px rgba(0,0,0,.9); }
  #cover .k { font: 600 42px 'Cormorant', serif; letter-spacing: .3em; }
  #cover .w { font: italic 500 200px/1 'Cormorant', serif; color: #f1c978; margin: 14px 0 4px; }
  #cover .q { font: 600 88px/1.05 'Cormorant', serif; }

  #you { position: absolute; left: 0; top: 0; width: 240px; text-align: center; opacity: 0;
    text-shadow: 0 2px 16px rgba(0,0,0,.85), 0 1px 3px rgba(0,0,0,.9); }
  #you .t { font: 700 38px 'Cormorant', serif; letter-spacing: .32em; padding-left: .32em; }
  #you .ln { width: 3px; height: 62px; margin: 4px auto 0; background: rgba(255, 246, 236, .92); }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #endcard { position: absolute; inset: 0; background: #000; opacity: 0; display: flex;
    flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #endcard .t { font: 500 76px/1.12 'Cormorant', serif; padding: 0 110px; }
  #endcard .rule { width: 120px; height: 1px; background: rgba(244,239,230,.5); margin: 44px 0 30px; }
  #endcard .s { font: 600 23px 'Cormorant', serif; letter-spacing: .34em; opacity: .7; }

  /* the compositor paints the overlay into the frame; the DOM copy only provides layout */
  #stage.compositing > div { visibility: hidden; }

  #hud { position: fixed; right: 8px; bottom: 8px; font: 12px monospace; color: #9f9;
    background: rgba(0,0,0,.6); padding: 4px 6px; z-index: 9; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",

</head>
<body>
<div id="stage">

  <div id="stampw" class="serif">TIME PASSED</div>
  <div id="stamp" class="serif"></div>
  <div id="title" class="serif">
    <div class="t">What if you lived 1 trillion years?</div>
  </div>
  <div id="cover" class="serif">
    <div class="k">WHAT IF YOU LIVED</div>
    <div class="w">1 trillion</div>
    <div class="q">years?</div>
  </div>
  <div id="you" class="serif"><div class="t">YOU</div><div class="ln"></div></div>
  <div id="flash"></div>
  <div id="endcard" class="serif">
    <div class="t">What if you lived 1 trillion years?</div>
    <div class="rule"></div>
    <div class="s">A SIMULATION</div>
  </div>
</div>
<script type="module" src="./src/main.js"></script>

</html>
