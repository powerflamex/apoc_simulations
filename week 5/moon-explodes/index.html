<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Moon explodes</title>
<style>
  @font-face { font-family: 'Cormorant'; font-style: normal; font-weight: 500;
    src: url('node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-500-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Cormorant'; font-style: italic; font-weight: 500;
    src: url('node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-500-italic.woff2') format('woff2'); }
  @font-face { font-family: 'Cormorant'; font-style: normal; font-weight: 600;
    src: url('node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-600-normal.woff2') format('woff2'); }

  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000;
    transform-origin: 0 0; }
  #stage canvas { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }

  .serif { font-family: 'Cormorant', Georgia, serif; color: #f4efe6; }

  #counter { position: absolute; left: 74px; top: 820px; width: 900px;
    text-shadow: 0 2px 18px rgba(0,0,0,.65), 0 1px 3px rgba(0,0,0,.7); }
  #counter .row { position: absolute; left: 0; top: 0; white-space: nowrap; }
  #counter .label { font: 600 30px 'Cormorant', serif; letter-spacing: .26em; opacity: .92; }
  /* the small TIME-LAPSE / SLOW MOTION tag next to the label (white on a dark chip, never red) */
  #counter .tag { display: inline-block; vertical-align: 3px; margin-left: 18px; font: 700 21px 'Cormorant', serif;
    letter-spacing: .18em; padding: 5px 10px 3px 12px; background: rgba(10, 12, 18, .5); color: #fff8ee; text-shadow: none; }
  #counter .value { font: 500 92px/1 'Cormorant', serif; letter-spacing: .01em; margin-top: 6px;
    font-variant-numeric: lining-nums tabular-nums; }
  #counter .unit { font: 700 44px 'Cormorant', serif; letter-spacing: .08em; opacity: 1; margin-top: 12px; white-space: nowrap; line-height: 1.1; }

  #caption { position: absolute; left: 60px; right: 60px; top: 1190px; text-align: center;
    font: italic 500 58px/1.15 'Cormorant', serif;
    text-shadow: 0 2px 22px rgba(0,0,0,.75), 0 1px 3px rgba(0,0,0,.85); }

  #title { position: absolute; left: 60px; right: 60px; top: 205px; text-align: center; opacity: 0;
    text-shadow: 0 2px 30px rgba(0,0,0,.9), 0 1px 4px rgba(0,0,0,.95); }
  #title .t { font: 600 100px/1.05 'Cormorant', serif; }

  #cover { position: absolute; left: 40px; right: 40px; top: 150px; text-align: center; opacity: 0;
    text-shadow: 0 4px 44px rgba(0,0,0,.9), 0 2px 6px rgba(0,0,0,.9); }
  #cover .k { font: 600 42px 'Cormorant', serif; letter-spacing: .3em; }
  #cover .w { font: italic 500 200px/1 'Cormorant', serif; color: #f1c978; margin: 14px 0 4px; }
  #cover .q { font: 600 88px/1.05 'Cormorant', serif; }

  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }

  /* the compositor paints the overlay into the frame; the DOM copy only provides layout */
  #stage.compositing > div { visibility: hidden; }

  #hud { position: fixed; right: 8px; bottom: 8px; font: 12px monospace; color: #9f9;
    background: rgba(0,0,0,.6); padding: 4px 6px; z-index: 9; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage">
  <div id="counter" class="serif"></div>
  <div id="caption" class="serif"></div>
  <div id="title" class="serif">
    <div class="t">What if the Moon exploded?</div>
  </div>
  <div id="cover" class="serif">
    <div class="k">WHAT IF THE</div>
    <div class="w">Moon</div>
    <div class="q">exploded?</div>
  </div>
  <div id="flash"></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
